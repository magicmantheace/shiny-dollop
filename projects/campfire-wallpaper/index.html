<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campfire Companions</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a0e22;
  }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center;
    color: #c9b18c; font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.08em; background: #0a0e22; z-index: 10;
    transition: opacity 1.2s ease; pointer-events: none;
  }
  #loading.done { opacity: 0; }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; padding: 2em;
    color: #d8c9ae; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 65%, #3a2417 0%, #131a36 55%, #070a1c 100%);
    z-index: 5;
  }
  /* Machine-readable scene status for the verification harness. */
  #status { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="loading">stoking the fire…</div>
<div id="fallback"><div>This wallpaper needs WebGL.<br>
If you are previewing it, serve this folder over HTTP (ES modules do not load from file://)<br>
and open it in Chrome or Edge.</div></div>
<div id="status">{}</div>
<script type="module" src="./js/wallpaper.js"></script>
</body>
</html>
