services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: livingworld
      POSTGRES_USER: livingworld
      POSTGRES_PASSWORD: livingworld
    volumes:
      - livingworld_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    environment:
      LIVINGWORLD_DATABASE_URL: postgresql+psycopg://livingworld:livingworld@postgres:5432/livingworld
      LIVINGWORLD_ADMIN_KEY: change-me
      LIVINGWORLD_HOST: 0.0.0.0
      LIVINGWORLD_PORT: 8000
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  livingworld_pg:
