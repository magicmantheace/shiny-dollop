name: Noisy repeated same-schema A-B-A-B learning

on:
  push:
    branches:
      - "priority/**"
    paths:
      - "developmental_ai/multi_switch_memory.py"
      - "benchmarks/multi_switch_protocol.json"
      - "benchmarks/multi_switch_benchmark.py"
      - "tests/test_multi_switch.py"
      - ".github/workflows/multi-switch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-multi-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Multi-switch replay and older regime learners
        run: python -m unittest tests.test_multi_switch tests.test_adaptive_horizon tests.test_fast_shock tests.test_same_schema_switch -v
      - name: Precommitted three-seed development cohort
        run: python -m benchmarks.multi_switch_benchmark --cohort development > multi-switch-development.json
      - name: Precommitted three-seed additional cohort
        run: python -m benchmarks.multi_switch_benchmark --cohort additional > multi-switch-additional.json
      - name: Report noisy evidence, all gate decisions, safety cost and competitors
        run: |
          python - <<'PY'
          import json
          for filename in ("multi-switch-development.json","multi-switch-additional.json"):
              data=json.load(open(filename,encoding="utf8"))
              print("RESULT",filename,"blind",data["blind"],
                    "learner_training_actions",data["learner_training_actions"])
              for stage in ("A","B1","return_A","B2"):
                  costs=[row["actor_actual_and_reported"][stage] for row in data["rows"]]
                  print("ACTOR",stage,{k:sum(c[k] for c in costs) for k in
                        ("observations","actual_harmful","reported_harmful",
                         "actual_productive","label_flips","actual_neutral")})
              for stage in ("B1","return_A","B2"):
                  points=({"B1":(0,2,4,8,12,16,24,32,48,64),
                           "return_A":(0,2,4,8,12,24,48),
                           "B2":(0,2,4,8,12,16,24,32,64)}[stage])
                  for checkpoint in points:
                      items=[row["stages"][stage][str(checkpoint)] for row in data["rows"]]
                      print("STAGE",stage,"observations",checkpoint,
                            "sources",[r["contrasting_decision"]["source"] for r in items],
                            "transitions",[r["contrasting_decision"]["inferred_transitions"][-4:]
                                           for r in items])
                      for name in ("contrastive_multi","adaptive_horizon","fast_shock",
                                   "legacy_disjoint","recent8","recent32","frozen_A",
                                   "untrained_random","always_abstain","privileged_oracle"):
                          scores=[r["scores"][name] for r in items]
                          print("SCORE",name,{k:sum(t[k] for t in scores)
                                              for k in ("successes","harmful_actions","abstained")})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-switch-noisy-cohorts-and-harm
          path: |
            multi-switch-development.json
            multi-switch-additional.json
          retention-days: 14
