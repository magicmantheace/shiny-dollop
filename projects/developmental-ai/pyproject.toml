[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "developmental-ai"
version = "0.1.0"
description = "Local-first developmental learning and held-out generalization experiments"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["developmental_ai*"]
